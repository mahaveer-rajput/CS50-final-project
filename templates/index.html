{% extends "layout.html" %}
 {% block content %}
<div class="backdrop">
  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Discover Art That Speaks.</h1>

      <p>
        Explore a world of creativity. Experience stunning
        artwork from talented creators worldwide.
      </p>

      <!-- SEARCH -->
      <form action="{{ url_for('search') }}" method="GET" class="search-box">
        <div class="search-box glass">
          <div class="search-input">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" 
              name="q" 
              placeholder="Search art, artists, collections..."
              value="{{ request.args.get('q', '') }}"
              autocomplete="off"
              required
              />
          </div>
        </div>
      </form>
    </div>
  </section>

  <section class="gallery">
    <h2 class="gallery-title">Featured Art</h2>

    <!-- Grid is now empty — JS fills it -->
    <div class="masonry-grid" id="feedGrid"></div>

    <!-- Loader sits outside the grid, below it -->
    <div id="loader" style="display:none;">
    <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

  </section>
</div>
<!-- Pixabay Modal -->
<div id="pixabayModal" class="px-modal">
    <div class="px-modal-content">
        <button class="px-close" id="closeModal">&times;</button>
        <img id="modalImg" src="" alt="" />
        <div class="px-modal-info">
            <h3 id="modalTitle"></h3>
            <p id="modalArtist"></p>
            <div class="px-modal-stats">
                <span><i class="fa-solid fa-heart"></i> <span id="modalLikes"></span></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
