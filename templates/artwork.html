{% extends "layout.html" %} {% block content %}

<section class="artwork-container">
  <!-- IMAGE -->
  <div class="artwork-left">
    <img src="{{ url_for('static', filename='uploads/' ~ art['image']) }}" />
  </div>

  <!-- DETAILS -->
  <div class="artwork-right">
    <h1 class="art-title">{{ art['title'] }}</h1>

    <p class="art-artist">by <strong>{{ art['artist'] }}</strong></p>

    <p class="art-desc">{{ art['description'] }}</p>

    <!-- ACTIONS -->
    <div class="art-actions">
      <!-- LIKE -->

      <button
        id="likeBtn"
        data-id="{{ art['id'] }}"
        class="btn-like {% if user_liked %}liked{% endif %}"
      >
        {% if user_liked %} ❤️ Liked {% else %} 🤍 Like {% endif %}
      </button>

      <!-- DOWNLOAD -->
      <a
        href="{{ url_for('static', filename='uploads/' ~ art['image']) }}"
        download
      >
        <button class="btn-download">⬇ Download</button>
      </a>
    </div>
    <!-- ❤️ LIKE COUNT -->
    <p class="like-count" id="likeCount"><i class="fa-solid fa-heart"></i> {{ art['like_count'] }} likes</p>
  </div>
</section>

<!-- 🔥 RELATED ARTWORKS -->
<section class="gallery">
  <h2 class="gallery-title">Related Artworks</h2>

  <div class="masonry-grid">
    {% for item in related %}
    <div class="masonry-item">
      <div class="image-container">
        <a href="{{ url_for('artwork', art_id=item['id']) }}">
          <img
            src="{{ url_for('static', filename='uploads/' ~ item['image']) }}"
          />
          <div class="overlayy">
            <div class="overlay-content">
              <h4>{{ art.title }}</h4>
              <p>{{ art.artist }}</p>
              <div class="overlay-stats">
                <span><i class="fa-solid fa-heart"></i> {{ art.like }} </span>
                <span><i class="fa-solid fa-download"></i></span>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
    {% endfor %}
  </div>
</section>

{% endblock %}
